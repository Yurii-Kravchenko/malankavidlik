<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Маланка — зворотній відлік</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0604; --text:#fff4e6; --muted:#d9b98f; --accent:#ff8a1f; --glow:rgba(255,138,31,.55);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Oswald','Arial Narrow',Arial,sans-serif;overflow:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%}
.shade{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.35) 0%,rgba(0,0,0,.78) 80%)}
main{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px}
.kicker{letter-spacing:.5em;font-weight:300;font-size:clamp(12px,2vw,20px);color:var(--muted);text-transform:uppercase}
h1{margin:.2em 0 .5em;font-weight:700;font-size:clamp(34px,8vw,96px);letter-spacing:.12em;text-transform:uppercase;text-shadow:0 0 40px var(--glow)}
.clock{display:flex;gap:clamp(10px,3vw,40px);justify-content:center}
.unit{min-width:0}
.num{display:block;font-weight:500;font-variant-numeric:tabular-nums;font-size:clamp(40px,11vw,150px);line-height:1;color:var(--text);text-shadow:0 0 30px var(--glow),0 0 2px #fff}
.num.roll{animation:roll .55s cubic-bezier(.2,.8,.2,1)}
@keyframes roll{from{transform:translateY(-.2em);opacity:.1;filter:blur(5px)}to{transform:none;opacity:1;filter:none}}
.lbl{display:block;margin-top:.5em;font-weight:300;letter-spacing:.3em;font-size:clamp(9px,1.6vw,16px);color:var(--accent);text-transform:uppercase}
.sep{font-size:clamp(30px,8vw,110px);color:var(--accent);opacity:.6;align-self:flex-start;line-height:1;animation:b 1s steps(2) infinite}
@keyframes b{50%{opacity:.1}}
.foot{margin-top:2.4em;font-weight:300;letter-spacing:.2em;font-size:clamp(10px,1.6vw,15px);color:var(--muted);text-transform:uppercase}
.foot b{font-weight:500;color:var(--text)}
.done{font-size:clamp(30px,7vw,80px);font-weight:700;letter-spacing:.1em;color:var(--accent);text-shadow:0 0 40px var(--glow)}
.snd{position:fixed;z-index:5;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.45);color:var(--text);border:1px solid var(--accent);padding:8px 14px;font:inherit;font-size:13px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;border-radius:999px}
.snd:hover{background:rgba(255,138,31,.25)}
.flame{animation:f 1.4s ease-in-out infinite alternate;transform-origin:50% 100%;transform-box:fill-box}
@keyframes f{to{transform:scale(1.06,.94)}}
@media (prefers-reduced-motion:reduce){.flame,.sep,.num.roll{animation:none}}
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05060d"/><stop offset=".6" stop-color="#1a0d0a"/><stop offset="1" stop-color="#4a1a08"/></linearGradient>
    <radialGradient id="fire" cx=".5" cy=".75" r=".6"><stop offset="0" stop-color="#ff9a2e" stop-opacity=".9"/><stop offset="1" stop-color="#ff5a00" stop-opacity="0"/></radialGradient>
    <linearGradient id="fl" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff4d00"/><stop offset=".6" stop-color="#ffa51f"/><stop offset="1" stop-color="#ffe27a"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <g fill="#fff" opacity=".8" id="stars"></g>
  <ellipse cx="800" cy="720" rx="700" ry="380" fill="url(#fire)"/>
  <path d="M0 760 Q400 700 800 740 T1600 730 V900 H0Z" fill="#0d0705"/>
  <!-- bonfire -->
  <g class="flame"><path d="M800 780 C740 720 760 660 790 620 C790 660 820 670 830 640 C870 690 870 740 800 780Z" fill="url(#fl)"/></g>
  <path d="M740 790 L860 770 M740 770 L860 790" stroke="#2a1608" stroke-width="12" stroke-linecap="round"/>
  <!-- masked carolers: goat, bear, devil -->
  <g fill="#050302">
    <!-- goat -->
    <g transform="translate(470 560)">
      <path d="M-30 20 Q-10 -20 0 -20 Q10 -20 30 20 Q36 80 40 220 H-40 Q-36 80 -30 20Z"/>
      <circle cx="0" cy="-45" r="26"/>
      <path d="M-18 -62 Q-50 -110 -22 -130 Q-34 -100 -8 -76Z M18 -62 Q50 -110 22 -130 Q34 -100 8 -76Z"/>
      <path d="M-8 -22 Q0 0 8 -22Z"/>
    </g>
    <!-- bear -->
    <g transform="translate(1130 570)">
      <path d="M-44 30 Q-20 -22 0 -22 Q20 -22 44 30 Q52 90 54 210 H-54 Q-52 90 -44 30Z"/>
      <circle cx="0" cy="-46" r="30"/>
      <circle cx="-22" cy="-72" r="11"/><circle cx="22" cy="-72" r="11"/>
    </g>
    <!-- devil -->
    <g transform="translate(980 600)">
      <path d="M-26 20 Q-8 -14 0 -14 Q8 -14 26 20 Q30 70 34 190 H-34 Q-30 70 -26 20Z"/>
      <circle cx="0" cy="-36" r="22"/>
      <path d="M-14 -52 L-30 -92 L-4 -60Z M14 -52 L30 -92 L4 -60Z"/>
    </g>
    <!-- shepherd with star -->
    <g transform="translate(650 610)">
      <path d="M-24 18 Q-6 -12 0 -12 Q6 -12 24 18 Q28 70 30 170 H-30 Q-28 70 -24 18Z"/>
      <circle cx="0" cy="-32" r="20"/>
    </g>
  </g>
  <!-- sparks -->
  <g fill="#ffb347" opacity=".85" id="sparks"></g>
</svg>
<div class="shade"></div>

<main>
  <div class="kicker">До свята залишилось</div>
  <h1>Маланка</h1>
  <div class="clock" id="clock" role="timer" aria-live="off">
    <div class="unit"><span class="num" id="d">0</span><span class="lbl">днів</span></div>
    <div class="sep">:</div>
    <div class="unit"><span class="num" id="h">00</span><span class="lbl">годин</span></div>
    <div class="sep">:</div>
    <div class="unit"><span class="num" id="m">00</span><span class="lbl">хвилин</span></div>
    <div class="sep">:</div>
    <div class="unit"><span class="num" id="s">00</span><span class="lbl">секунд</span></div>
  </div>
  <div class="foot">Старт: <b>9.01.2027, 12:00 (Київ)</b></div>
</main>
<button class="snd" id="snd" type="button">🔇 Увімкнути звук</button>

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAP//AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABAAAAAAAAAP//AAAAAAAAAAAAAAAA//8AAAAAAAAAAP//AAAAAAAAAAAAAAAAAAAAAP//AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP//AAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//wAAAAAAAAEAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//wAAAAABAAAAAAABAAAAAAAAAAAAAAAAAAAA//8AAAAAAAAAAAAAAAAAAAAA//8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD/////AAAAAAAAAAAAAAAAAAAAAAAAAQAAAAAA//8AAAAAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAA//8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//8AAAEAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP//AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAD//wAA//8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//8AAAAAAAAAAAAAAAD//wAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//wAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP//AAAAAAAAAAAAAAAA//8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'];
  var buffers=[], ctx=null, soundOn=false, loaded=false, schedT=null, nextIdx=0;
  var PRE=0.005; // у семплі удар починається на 5 мс
  function b64ToBuf(str){ var bin=atob(str), u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u.buffer; }
  function loadClips(){
    if(loaded) return Promise.resolve();
    return Promise.all(CLIPS_B64.map(function(c){ return ctx.decodeAudioData(b64ToBuf(c)); })).then(function(r){ buffers=r; loaded=true; });
  }
  // планує удар точно на момент зміни цифр за годинником аудіосистеми
  function scheduleNext(){
    if(!soundOn||!ctx||!loaded) return;
    var diff=TARGET-Date.now();
    if(diff<=0) return;
    var t=Math.floor(diff/1000);
    if(schedT===t) return;
    var ms=diff-t*1000;
    var lat=(ctx.outputLatency||ctx.baseLatency||0);
    var when=ctx.currentTime+ms/1000-PRE-lat;
    if(when<ctx.currentTime) when=ctx.currentTime;
    var src=ctx.createBufferSource(), g=ctx.createGain();
    src.buffer=buffers[nextIdx]; nextIdx=(nextIdx+1)%buffers.length;
    g.gain.value=.85;
    src.connect(g); g.connect(ctx.destination); src.start(when);
    schedT=t;
  }
  var btn=el('snd');
  btn.addEventListener('click',function(){
    try{
      if(soundOn){ soundOn=false; btn.textContent='🔇 Увімкнути звук'; return; }
      if(!ctx){ ctx=new (window.AudioContext||window.webkitAudioContext)(); }
      if(ctx.state==='suspended'){ ctx.resume(); }
      btn.textContent='🔊 Завантаження…';
      loadClips().then(function(){ schedT=null; soundOn=true; btn.textContent='🔊 Звук увімкнено'; }).catch(function(){ btn.textContent='🔇 Звук недоступний'; });
    }catch(e){}
  });

  var last={}, lastT=null;
  function setNum(id,val){
    if(last[id]===val) return;
    last[id]=val;
    var n=el(id);
    n.textContent=val;
    n.classList.remove('roll');
    void n.offsetWidth;
    n.classList.add('roll');
  }

  function frame(){
    var diff=TARGET-Date.now();
    if(diff<=0){
      el('clock').innerHTML='<div class="done">Маланка почалась!</div>';
      return;
    }
    var t=Math.floor(diff/1000);
    if(t!==lastT){
      setNum('d',String(Math.floor(t/86400)));
      setNum('h',p(Math.floor(t%86400/3600),2));
      setNum('m',p(Math.floor(t%3600/60),2));
      setNum('s',p(t%60,2));
      lastT=t;
    }
    scheduleNext();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setInterval(scheduleNext,150);
